name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Tests (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Tests
        if: runner.os != 'Linux'
        run: npm test

  # Runs the action itself against a fixture app, the way users will.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build a fixture app
        id: fixture
        run: node test/make-fixture.js >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: ./
        with:
          path: ${{ steps.fixture.outputs.path }}
          expect: |
            main.js
            index.html
